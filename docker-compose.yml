version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: supplierhub-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: supplierhub
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - supplierhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplierhub-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=supplierhub
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    networks:
      - supplierhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: supplierhub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - supplierhub-network

volumes:
  mongodb_data:

networks:
  supplierhub-network:
    driver: bridge
